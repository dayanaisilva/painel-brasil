name: Auditoria independente

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["auditoria/**"]

permissions:
  contents: write

concurrency:
  group: auditoria
  cancel-in-progress: true

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl
      - run: python auditoria/recalcular.py
      - name: Versionar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria/resultados
          git diff --cached --quiet && exit 0
          git commit -m "auditoria: resultados $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git pull --rebase -X theirs origin main && git push
